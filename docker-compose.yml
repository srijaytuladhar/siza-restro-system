version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: siza-restro-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=siza_restro
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1234
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siza-network

  redis:
    image: redis:7-alpine
    container_name: siza-restro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - siza-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siza-restro-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:mysql://db:3306/siza_restro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=1234
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - siza-network

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: siza-restro-admin
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - siza-network

volumes:
  mysql_data:
  redis_data:

networks:
  siza-network:
    driver: bridge
