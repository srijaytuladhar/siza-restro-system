server:
  port: 8080
#  address: 192.168.56.1
spring:
  application:
    name: siza-restro-backend
  datasource:
    url: jdbc:mysql://localhost:3306/sizarestro?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

# Custom JWT configuration
app:
  jwt:
    secret: 9a67471ec97aa3cf2eb745bb38cd14457747de0b35b5a6c3f3ef841cf6f8d098e94582f3ef7e98a3b5a19c5b6b7d8d9a24c56e7e8a9f0e1d2c3b4a5f6e7d8c9b
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.sizarestro: DEBUG
    org.hibernate.SQL: DEBUG
